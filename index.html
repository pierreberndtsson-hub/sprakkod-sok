<meta charset="UTF-8">

<title>Språkkod Sök – ISO 639-1</title>
<style>
  :root {
    --bg: #0f1419;
    --card: #1a2332;
    --accent: #3b82f6;
    --accent2: #10b981;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --border: #334155;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
    line-height: 1.5;
  }
  .container { max-width: 700px; margin: 0 auto; }
  h1 { font-size: 1.8rem; margin-bottom: 0.3rem; text-align: center; }
  .subtitle { text-align: center; color: var(--muted); margin-bottom: 1.5rem; font-size: 0.95rem; }
  .search-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  input[type="text"] {
    width: 100%;
    background: #0f172a;
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    font-size: 1.4rem;
    color: var(--text);
    letter-spacing: 2px;
    text-transform: uppercase;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  input::placeholder { color: var(--muted); letter-spacing: 0; text-transform: none; font-size: 1rem; }
  .result {
    background: var(--card);
    border-radius: 16px;
    padding: 24px;
    min-height: 140px;
    border: 1px solid var(--border);
    transition: all 0.2s;
  }
  .result.empty { opacity: 0.6; text-align: center; padding-top: 40px; }
  .code-big {
    font-size: 3.2rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 4px;
    line-height: 1;
    margin-bottom: 8px;
  }
  .lang-name { font-size: 1.5rem; font-weight: 600; margin-bottom: 4px; }
  .lang-native { color: var(--muted); font-size: 1.05rem; margin-bottom: 12px; }
  .countries { font-size: 0.95rem; color: var(--accent2); }
  .note { margin-top: 16px; font-size: 0.85rem; color: var(--muted); text-align: center; }
  .list-toggle {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 10px;
    cursor: pointer;
    margin: 20px auto;
    display: block;
    font-size: 0.95rem;
  }
  .list-toggle:hover { background: var(--card); }
  #full-list { display: none; margin-top: 20px; }
  #full-list.show { display: block; }
  .lang-item {
    display: flex;
    justify-content: space-between;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 0.95rem;
  }
  .lang-item:hover { background: #1e293b; }
  .lang-code { font-weight: 700; color: var(--accent); min-width: 50px; }
  .footer { text-align: center; margin-top: 40px; color: var(--muted); font-size: 0.8rem; }
</style>
</head>
<body>
<div class="container">
  <h1>Språkkod Sök</h1>
  <p class="subtitle">Skriv två bokstäver → få språket direkt (ISO 639-1)</p>

  <div class="search-box">
    <input type="text" id="search" placeholder="Skriv t.ex. SV, EN, DE..." maxlength="2" autofocus autocomplete="off" spellcheck="false">
  </div>

  <div class="result empty" id="result">
    Skriv två bokstäver ovan för att se språket
  </div>

  <p class="note">Koderna är för <strong>språk</strong>, inte länder. Många språk talas i flera länder.</p>

  <button class="list-toggle" id="toggleList">Visa hela listan</button>
  <div id="full-list"></div>

  <div class="footer">
    ISO 639-1 · ~184 officiella tvåbokstavskoder<br>
    Data baserad på officiell ISO-standard
  </div>
</div>

const searchInput = document.getElementById("search");
const resultDiv = document.getElementById("result");
const fullList = document.getElementById("full-list");
const toggleBtn = document.getElementById("toggleList");

function updateResult() {
  const code = searchInput.value.trim().toLowerCase();
  if (code.length !== 2) {
    resultDiv.className = "result empty";
    resultDiv.innerHTML = "Skriv två bokstäver ovan för att se språket";
    return;
  }
  const lang = languages[code];
  if (lang) {
    resultDiv.className = "result";
    resultDiv.innerHTML = `
      <div class="code-big">${code.toUpperCase()}</div>
      <div class="lang-name">${lang.name}</div>
      <div class="lang-native">${lang.native || ""}</div>
      <div class="countries">Vanliga länder/områden: ${lang.countries || "—"}</div>
    `;
  } else {
    resultDiv.className = "result";
    resultDiv.innerHTML = `
      <div class="code-big">${code.toUpperCase()}</div>
      <div class="lang-name">Ingen träff</div>
      <div class="lang-native">Koden finns inte i ISO 639-1</div>
    `;
  }
}

searchInput.addEventListener("input", updateResult);

// Build full list
const codes = Object.keys(languages).sort();
fullList.innerHTML = codes.map(code => {
  const l = languages[code];
  return `<div class="lang-item"><span class="lang-code">${code.toUpperCase()}</span><span>${l.name}</span></div>`;
}).join("");

toggleBtn.addEventListener("click", () => {
  fullList.classList.toggle("show");
  toggleBtn.textContent = fullList.classList.contains("show") ? "Dölj listan" : "Visa hela listan";
});

// Allow paste and auto-uppercase feel
searchInput.addEventListener("keyup", (e) => {
  if (e.key === "Enter") searchInput.blur();
});
</script>
</body>
</html>
